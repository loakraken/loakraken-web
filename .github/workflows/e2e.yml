name: E2E

# QA 스모크·회귀 E2E(e2e/ Playwright). 합성 목 백엔드만 쓰며 공식 API·OpenAI 호출과 비밀값이 없다.
# 비필수(정보용) 검사로 시작한다(PM-프론트 결정 2026-10-09). 10-23쯤 실행 통계를 보고 필수 전환을 판단한다.
# 글(content/ · docs/ · e2e/ 밖의 .md)만 바뀌면 건너뛰고, 그 밖의 변경은 모두 돈다(11-19 보안 점검: 고른 경로만 돌리던
# 목록은 proxy.ts처럼 빠진 파일을 놓쳤다). 같은 PR의 이전 실행은 취소한다.
# PR은 경로와 상관없이 늘 시작하고, 첫 job 'changes'가 글만 바뀐 PR이면 나머지 job을 건너뛴다. 'e2e webkit'이 필수
# 검사라(11-15) 실행 자체가 안 뜨면 글만 바꾼 PR이 병합되지 못하는데, 조건(if:)으로 건너뛴 job은 통과로 친다.
# 초안 PR은 e2e를 돌리지 않고, 필수 'e2e webkit'은 건너뛰지 않고 바로 실패한다. 건너뜀(통과)으로 두면 준비 완료로
# 바꾼 같은 커밋의 새 실행이 webkit에 닿기 전까지 그 통과가 최신 결과라 병합이 열렸다(11-19 보안 점검).
# develop push는 on.push.paths로 같은 규칙을 쓴다(대기 중인 코드 push 실행이 뒤이은 글만 바뀐 push 실행으로 바뀌어
# 빠지는 일이 없게).
# develop push(병합 뒤)에도 돌아 병합마다 통계 표본(e2e-stats)을 남긴다(10-10, 저장소 공개로 Actions 시간 제한 없음).
#
# 나눠 돌리기(사용자 요청 2026-10-31, 한 번에 약 33분 → 목표 약 10분, 테스트는 하나도 빼지 않는다):
# 1) build: 운영 빌드(next build → standalone)를 한 번만 만들어 산출물로 넘긴다(4번 빌드하지 않음).
# 2) shard 1~6: 화면 크기 세 프로젝트(desktop-1440·tablet-768·mobile-390)를 6개 러너가 나눠 돈다(파일을 잰 시간으로
#    나눔, e2e/shard-plan.mjs).
# 3) serial: 혼자 돌아야 하는 isolated(목 실패 장치)·solo(CPU 측정)와 성능 점검을 자기 러너에서 차례로 돈다.
#    러너마다 목 백엔드가 따로 떠서 다른 shard와 실패 예약을 나누지 않는다.
# 4) e2e: 위 결과를 하나로 합쳐 요약·통계를 남기고, 하나라도 실패하면 실패한다. 검사 이름 'e2e'는 그대로라
#    PR 화면과 검토 도구가 보는 이름이 바뀌지 않는다.
on:
  pull_request:
    branches: [develop, master, "ci-test/**"]
    types: [opened, synchronize, reopened, ready_for_review]
    # paths는 두지 않는다(머리말). 같은 목록을 changes job이 본다.
  push:
    branches: [develop]
    # 글만 빼고 모두(뒤 패턴이 앞을 덮는다). e2e/의 .md는 시험 자료라 다시 넣는다.
    # 이 목록을 바꾸면 changes job의 판정(awk)도 같이 바꾼다.
    paths:
      - "**"
      - "!content/**"
      - "!docs/**"
      - "!**.md"
      - "e2e/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  # PR은 이전 실행을 취소한다. develop push는 취소하지 않아 병합마다 통계 표본(e2e-stats)이 남는다(대기 중인 실행은 GitHub가 가장 최근 하나만 둔다).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: 1
  E2E_CHANNEL: chromium
  # 운영 빌드(next build → standalone server.js)로 띄운다(QA #133). dev 서버는 CI에서 홈 화면 수화 지연으로 flaky가 났다(10-09 비교).
  E2E_SERVER: standalone

jobs:
  # PR이 글 말고 다른 것을 바꿨는지 본다(on.push.paths와 같은 규칙). 새 외부 action 없이 git으로만 본다.
  # PR은 병합 커밋(refs/pull/N/merge)과 그 첫 부모(받는 브랜치 끝)를 비교해, 받는 브랜치에 들어갈 변경 전체를 본다.
  # push와 수동 실행은 늘 돈다(push는 on.push.paths가 이미 걸렀다). 비교가 안 되면 돌리는 쪽으로 간다.
  changes:
    # 초안 PR은 건너뛴다(뒤 job도 모두 건너뜀). develop push와 수동 실행은 항상.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: e2e changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.match.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          # 병합 커밋과 첫 부모만 있으면 된다. 받은 뒤 git 원격을 쓰지 않아 토큰을 남기지 않는다.
          fetch-depth: 2
          persist-credentials: false
      - name: Find changes other than text
        id: match
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          run_all() { echo "$1: 모두 돈다"; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$EVENT" = pull_request ] || run_all "$EVENT"
          # --no-renames: 옮긴 파일은 옛 경로와 새 경로가 둘 다 나온다(app/ 밖으로 옮겨도 잡힘).
          files=$(git -c core.quotepath=off diff --no-renames --name-only HEAD^1 HEAD) || run_all "변경 파일 비교 실패"
          [ -n "$files" ] || run_all "바뀐 파일 없음"
          # 글: content/ · docs/, 그리고 e2e/ 밖의 .md(e2e/의 .md는 시험 자료). on.push.paths와 같은 규칙.
          matched=$(printf '%s\n' "$files" | awk 'NF && !/^(content|docs)\// && !(/\.md$/ && !/^e2e\//)')
          echo "바뀐 파일 $(printf '%s\n' "$files" | grep -c .)개, 그중 글이 아닌 것 $(printf '%s\n' "$matched" | grep -c .)개"
          [ -z "$matched" ] || printf '%s\n' "$matched" | head -20
          if [ -n "$matched" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "글만 바뀜: build·shard·serial·webkit·e2e를 건너뛴다(조건으로 건너뛴 job은 통과로 친다)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    # changes가 e2e 경로 변경을 찾았을 때만. 초안 PR은 changes를 건너뛰어 여기도 건너뛴다.
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 예전처럼 e2e 설정(playwright.config.mjs의 api 값)과 같은 환경으로 빌드한다. 빌드 때 읽는 값(시험용 개발자 노트 등)이 같아야 한다.
      LOAKRAKEN_API_ORIGIN: http://127.0.0.1:3201
      CHARACTER_INDEXING: "on"
      PRICE_ALERTS: "on"
      DEV_NOTES_DIR: ${{ github.workspace }}/e2e/support/dev-notes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install app dependencies
        run: npm ci --no-audit --no-fund
      - name: Cache Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      # 예전에는 목 백엔드가 떠 있는 동안 빌드했다(webServer 순서). 빌드 중 요청이 있어도 같게 목을 먼저 띄운다.
      - name: Start mock backend
        run: |
          MOCK_PORT=3201 node tests/mock-backend.mjs > /tmp/mock.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3201/__counts && exit 0; sleep 1; done
          cat /tmp/mock.log; exit 1
      - name: Build standalone app
        run: npx next build
      - name: Pack build
        run: tar -czf e2e-build.tgz .next/standalone .next/static
      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-build
          path: e2e-build.tgz
          retention-days: 1

  shard:
    needs: build
    name: e2e shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # 한 shard가 실패해도 나머지는 끝까지 돌아 실패 목록이 한 번에 다 나온다.
      fail-fast: false
      matrix:
        # shard 수는 이 목록 하나로 정한다(전체 수는 strategy.job-total). 같은 PR에서 4개 12분 12초, 6개 8분 43초였고
        # 3분 넘게 줄어 6개로 둔다(#1180). 한 번에 job 8개(build·shard 6·serial)를 쓰므로 계정의 동시 job 한도(20)를
        # api CI·다른 PR과 나눠 쓴다는 점을 염두에 둔다.
        shard: [1, 2, 3, 4, 5, 6]
    env:
      # build job의 standalone 빌드를 쓴다(e2e/support/standalone-server.mjs가 다시 빌드하지 않음).
      E2E_SKIP_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci --no-audit --no-fund
      - name: Read Playwright version
        id: pw
        working-directory: e2e
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: Install Chromium with system dependencies
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system dependencies only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: e2e
        run: npx playwright install-deps chromium
      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-build
      - name: Unpack build
        run: tar -xzf e2e-build.tgz && rm e2e-build.tgz
      # --shard은 테스트 수로 똑같이 잘라, 오래 걸리는 첫 화면 훑기·a7-controls가 몰린 shard 셋이 16분, 나머지가
      # 6~8분이었다(develop 43598870311). 파일을 잰 시간(shard-times.json)으로 나눠 shard마다 비슷하게 돈다
      # (shard-plan.mjs). 파일 목록은 모든 shard가 같은 계산으로 얻는다. 먼저 smoke/·regression/의 spec 파일이 모두
      # shard 하나 또는 serial(isolated·solo) 하나에서만 도는지 확인하고(--verify), 실행 뒤에는 'e2e' job의 테스트 수
      # 검사가 한 번 더 잡는다.
      - name: Plan shard files by measured time
        working-directory: e2e
        run: |
          npx playwright test --project=desktop-1440 --project=tablet-768 --project=mobile-390 --list --reporter=json > shard-list.json
          npx playwright test --project=isolated --project=solo --no-deps --list --reporter=json > serial-list.json
          node shard-plan.mjs --verify shard-list.json serial-list.json ${{ strategy.job-total }}
          node shard-plan.mjs shard-list.json ${{ matrix.shard }} ${{ strategy.job-total }} > shard-files.txt
          # 이 shard가 도는 파일(느린 shard를 볼 때 무엇이 들었는지 바로 보이게).
          cat shard-files.txt
      - name: Run E2E shard
        working-directory: e2e
        env:
          # --shard 없이는 shard마다 blob 이름이 report.zip이라, 합칠 때 서로 덮어쓴다.
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.shard }}.zip
        run: npx playwright test --project=desktop-1440 --project=tablet-768 --project=mobile-390 $(cat shard-files.txt) --reporter=list,blob
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-shard-${{ matrix.shard }}
          path: e2e/blob-report
          if-no-files-found: ignore
          retention-days: 1
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces-shard-${{ matrix.shard }}
          path: e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

  serial:
    needs: build
    name: e2e isolated·solo·perf
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_SKIP_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci --no-audit --no-fund
      - name: Read Playwright version
        id: pw
        working-directory: e2e
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: Install Chromium with system dependencies
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system dependencies only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: e2e
        run: npx playwright install-deps chromium
      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-build
      - name: Unpack build
        run: tar -xzf e2e-build.tgz && rm e2e-build.tgz
      # isolated(목 실패 장치)와 solo(CPU 측정)는 다른 테스트와 함께 돌면 안 된다. 이 러너는 다른 테스트를 돌리지 않으므로
      # 앞선 프로젝트를 기다리지 않고(--no-deps) 한 작업자(--workers=1)로 isolated → solo 차례로 돈다.
      - name: Run isolated and solo
        working-directory: e2e
        run: npx playwright test --project=isolated --project=solo --no-deps --workers=1 --reporter=list,blob
      # 내 API 키(BYOK)를 켠 서버를 따로(3203) 띄워 본다. 위 실행이 끝나 목·서버가 내려간 뒤 같은 빌드로 돈다.
      # 기본 설정은 플래그가 꺼진 채로 둔다(꺼진 상태는 regression/byok-off가 본다). 실패하면 이 job과 'e2e'가 실패한다.
      - name: Run BYOK (flag on)
        if: ${{ !cancelled() }}
        working-directory: e2e
        run: npx playwright test -c playwright.byok.config.mjs
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-serial
          path: e2e/blob-report
          if-no-files-found: ignore
          retention-days: 1
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces-serial
          path: |
            e2e/test-results
            e2e/test-results-byok
          if-no-files-found: ignore
          retention-days: 7
      # 성능 점검(비필수·정보용, PM 총괄 결정 2026-10-09). 390px·CPU 4배로 LCP·CLS·INP를 잰다.
      # 위 build job의 standalone 빌드를 다시 쓴다(E2E_SKIP_BUILD). 이 러너에는 다른 테스트가 없어 CPU를 다투지 않는다.
      # 흔들림을 보려고 같은 커밋에서 3회 반복한다. perf 테스트는 순서대로(serial) 돌아 E2E_PERF_ENFORCE를 켜면
      # 첫 기준 초과 뒤 나머지가 건너뛰어져 기록이 빠진다(10-09 확인). 그래서 여기서는 모두 재고, 기준 판정은 아래 요약 단계가 한다.
      # 측정 자체가 실패해도 job·PR은 막지 않는다(continue-on-error).
      - name: Run performance budget
        id: perf
        if: always()
        continue-on-error: true
        working-directory: e2e
        env:
          E2E_PERF: "1"
          PLAYWRIGHT_JSON_OUTPUT_NAME: perf-results.json
        run: npx playwright test --project=perf --repeat-each=3 --retries=0 --reporter=list,json
      - name: Summarize performance
        if: always()
        working-directory: e2e
        run: |
          node --input-type=commonjs <<'JS'
            const fs = require("fs");
            if (!fs.existsSync("perf-results.json")) { console.log("perf-results.json 없음(실행 전 실패)"); process.exit(0); }
            const report = JSON.parse(fs.readFileSync("perf-results.json", "utf8"));
            const rows = [];
            const seen = {}; // 같은 화면의 몇 번째 반복인지(JSON 보고서에는 반복 번호가 없다)
            const walk = (suite) => {
              for (const spec of suite.specs ?? []) for (const t of spec.tests ?? []) for (const r of t.results ?? []) {
                const a = (r.attachments ?? []).find((x) => x.name === "perf" && x.body);
                if (!a) continue;
                const m = JSON.parse(Buffer.from(a.body, "base64").toString("utf8"));
                // 기준(LCP 2.5초·CLS 0.1·INP 200ms)을 넘었는지 여기서 판정한다(작업 규칙 '성능 우선').
                const over = [m.lcpMs > 2500 && "LCP", m.cls > 0.1 && "CLS", m.inpMs > 200 && "INP"].filter(Boolean);
                rows.push({ run: process.env.GITHUB_RUN_ID, pr: process.env.PR, sha: process.env.GITHUB_SHA, status: r.status, over, ...m, repeat: (seen[m.page] = (seen[m.page] ?? 0) + 1) });
              }
              for (const s of suite.suites ?? []) walk(s);
            };
            for (const s of report.suites ?? []) walk(s);
            fs.writeFileSync("e2e-perf.jsonl", rows.map((x) => JSON.stringify(x)).join("\n") + (rows.length ? "\n" : ""));
            let md = "### 성능 점검(비필수, 390px·CPU 4배, 기준 LCP 2.5초·CLS 0.1·INP 200ms)\n\n| 화면 | 회차 | LCP(ms) | CLS | 로딩 CLS | INP(ms) | 긴 작업 | 결과 |\n|---|---|---|---|---|---|---|---|\n";
            for (const x of rows) md += `| ${x.page} | ${x.repeat} | ${x.lcpMs} | ${x.cls} | ${x.loadCls} | ${x.inpMs} | ${x.longTasks} | ${x.status !== "passed" ? "측정 실패" : x.over.length ? `기준 초과(${x.over.join("·")})` : "기준 안"} |\n`;
            if (!rows.length) md += "| (결과 없음) | | | | | | | |\n";
            const overCount = rows.filter((x) => x.over.length).length;
            // 막지 않고 경고 표시만 남긴다(비필수·정보용).
            if (overCount) console.log(`::warning title=성능 기준 초과::${rows.length}회 중 ${overCount}회가 기준(LCP 2.5초·CLS 0.1·INP 200ms)을 넘었습니다. 실행 요약 표를 보세요.`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
            console.log(md);
          JS
        env:
          PR: ${{ github.event.pull_request.number }}
      - name: Upload performance rows
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-perf
          path: e2e/e2e-perf.jsonl
          if-no-files-found: ignore
          retention-days: 1

  # WebKit(Safari 엔진) 휴대폰 크기, @webkit 태그 검사만(#1609). Safari만 다르게 가는 길(scroll-initial-target ·
  # overflow-anchor 없음)을 실제 브라우저로 본다. 위 build의 standalone 빌드를 다시 쓴다(E2E_SKIP_BUILD).
  # 묶음 'e2e'의 needs에는 넣지 않는다. 5번 연속 초록 뒤 develop 룰셋의 필수 검사가 됐다(11-15). WebKit 캐시 키는
  # chromium과 따로 둔다.
  webkit:
    needs: [changes, build]
    name: e2e webkit
    # 필수 검사다. 건너뛰는 때는 changes가 '글만 바뀜'이라 한 때뿐이다. 초안 PR, changes나 build의 실패, 실행 취소에는
    # 건너뛰지 않고 돌아 아래 첫 단계에서 실패한다(건너뛴 필수 검사는 통과로 쳐서, 그런 때를 건너뜀으로 숨기면 안 된다).
    # 그래서 !cancelled()가 아니라 always()다: 취소된 실행에서도 이 job은 뜬다.
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_SKIP_BUILD: "1"
      E2E_WEBKIT: "1"
    steps:
      - name: Not run on a draft
        # 초안: 통과로 남기지 않는다. 준비 완료로 바꾸면(ready_for_review) 새 실행이 끝날 때까지 이 실패가 최신 결과다.
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.draft
        run: |
          echo "::error title=e2e webkit::초안 PR이라 e2e를 돌리지 않았습니다. '준비 완료'로 바꾸면 전체 e2e가 돕니다."
          exit 1
      - name: Require changes and build
        # always(): 취소된 실행에서도 이 단계는 돈다(기본 조건 success()는 취소 때 거짓이라 단계가 모두 건너뛰어지고
        # job이 통과로 끝날 수 있다).
        if: always() && !(github.event_name == 'pull_request' && github.event.pull_request.draft) && (cancelled() || needs.changes.result != 'success' || needs.build.result != 'success')
        run: |
          echo "::error title=e2e webkit::changes=${{ needs.changes.result }} build=${{ needs.build.result }} — 앞 job이 실패했거나 실행이 취소돼 WebKit 검사를 돌리지 않았습니다."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci --no-audit --no-fund
      - name: Read Playwright version
        id: pw
        working-directory: e2e
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-webkit
      - name: Install WebKit with system dependencies
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install --with-deps webkit
      - name: Install WebKit system dependencies only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: e2e
        run: npx playwright install-deps webkit
      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-build
      - name: Unpack build
        run: tar -xzf e2e-build.tgz && rm e2e-build.tgz
      - name: Run WebKit checks
        working-directory: e2e
        run: npx playwright test --project=webkit-phone --reporter=list
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces-webkit
          path: e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    # 검사 이름 'e2e'를 지키는 묶음 job: 모든 shard·serial 결과를 합쳐 요약하고, 하나라도 실패하면 실패한다.
    needs: [changes, build, shard, serial]
    # changes가 'e2e 경로 변경 없음'이라 하면 건너뛴다. changes가 실패하면 돌아서 아래 마지막 단계에서 실패한다.
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.changes.result != 'success' || needs.changes.outputs.run == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci --no-audit --no-fund
      - name: Download blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-*
          path: e2e/all-blob-reports
          merge-multiple: true
      - name: Merge reports
        if: always()
        working-directory: e2e
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
        run: |
          if [ -d all-blob-reports ] && [ -n "$(ls -A all-blob-reports)" ]; then
            npx playwright merge-reports --reporter=json,html ./all-blob-reports
          else
            echo "blob 보고서 없음(테스트 실행 전 실패)"
          fi
      - name: Summarize run
        if: always()
        working-directory: e2e
        run: |
          node --input-type=commonjs <<'JS'
            const fs = require("fs");
            if (!fs.existsSync("results.json")) { console.log("results.json 없음(실행 전 실패)"); process.exit(0); }
            const s = JSON.parse(fs.readFileSync("results.json", "utf8")).stats ?? {};
            const row = {
              run: process.env.GITHUB_RUN_ID, pr: process.env.PR, sha: process.env.GITHUB_SHA, server: process.env.E2E_SERVER ?? "dev",
              expected: s.expected ?? 0, unexpected: s.unexpected ?? 0, flaky: s.flaky ?? 0, skipped: s.skipped ?? 0,
              minutes: Math.round((s.duration ?? 0) / 600) / 100,
            };
            fs.writeFileSync("e2e-stats.json", JSON.stringify(row) + "\n");
            const md = `### E2E 결과(shard 전체 + isolated·solo 합계)\n\n| 통과 | 실패 | 재시도 후 통과(flaky) | 건너뜀 | 테스트 시간(분) |\n|---|---|---|---|---|\n| ${row.expected} | ${row.unexpected} | ${row.flaky} | ${row.skipped} | ${row.minutes} |\n`;
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
            console.log(md);
          JS
        env:
          PR: ${{ github.event.pull_request.number }}
      # shard 보고서 하나가 올라가지 않아도 위 합계는 조용히 줄어든다. 같은 프로젝트의 테스트 목록(--list, 서버를 띄우지 않음)과
      # 합친 결과의 테스트 수를 맞춰 보고, 다르면 실패한다(#1180 리뷰).
      - name: Check every test was reported
        if: always()
        working-directory: e2e
        run: |
          [ -f results.json ] || { echo "results.json 없음: 위 단계에서 이미 실패"; exit 1; }
          npx playwright test --project=desktop-1440 --project=tablet-768 --project=mobile-390 --project=isolated --project=solo --list --reporter=json > list.json
          node --input-type=commonjs <<'JS'
            const fs = require("fs");
            const count = (suite) => (suite.specs ?? []).reduce((n, s) => n + (s.tests ?? []).length, 0) + (suite.suites ?? []).reduce((n, s) => n + count(s), 0);
            const listed = JSON.parse(fs.readFileSync("list.json", "utf8")).suites.reduce((n, s) => n + count(s), 0);
            const s = JSON.parse(fs.readFileSync("results.json", "utf8")).stats ?? {};
            const reported = (s.expected ?? 0) + (s.unexpected ?? 0) + (s.flaky ?? 0) + (s.skipped ?? 0);
            console.log(`목록 ${listed}개, 보고 ${reported}개`);
            if (!listed || listed !== reported) {
              console.log(`::error title=E2E 테스트 수 불일치::목록 ${listed}개와 합친 보고 ${reported}개가 다릅니다. shard 보고서가 빠졌는지 보세요.`);
              process.exit(1);
            }
          JS
      - name: Download performance rows
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-perf
          path: e2e
      - name: Upload stats
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-stats
          path: |
            e2e/e2e-stats.json
            e2e/e2e-perf.jsonl
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload report
        if: always() && (needs.shard.result != 'success' || needs.serial.result != 'success')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail when any part failed
        if: always()
        run: |
          echo "changes=${{ needs.changes.result }} build=${{ needs.build.result }} shard=${{ needs.shard.result }} serial=${{ needs.serial.result }}"
          [ "${{ needs.changes.result }}" = success ] && [ "${{ needs.build.result }}" = success ] && [ "${{ needs.shard.result }}" = success ] && [ "${{ needs.serial.result }}" = success ]
