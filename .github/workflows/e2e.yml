name: E2E

# QA 스모크·회귀 E2E(e2e/ Playwright). 합성 목 백엔드만 쓰며 공식 API·OpenAI 호출과 비밀값이 없다.
# 비필수(정보용) 검사로 시작한다(PM-프론트 결정 2026-10-09). 10-23쯤 실행 통계를 보고 필수 전환을 판단한다.
# Actions 사용 시간 절약: develop·master 대상 PR에서 앱 코드·e2e 경로가 바뀔 때만 돈다. 같은 PR의 이전 실행은 취소한다.
on:
  pull_request:
    branches: [develop, master]
    paths:
      - app/**
      - components/**
      - lib/**
      - public/**
      - contracts/**
      - e2e/**
      - tests/mock-backend.mjs
      - package.json
      - package-lock.json
      - next.config.ts
      - tsconfig.json
      - postcss.config.mjs
      - .github/workflows/e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: 1
      E2E_CHANNEL: chromium
      E2E_SERVER: standalone
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
      - name: Install app dependencies
        run: npm ci --no-audit --no-fund
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci --no-audit --no-fund
      - name: Read Playwright version
        id: pw
        working-directory: e2e
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: Install Chromium with system dependencies
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system dependencies only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: e2e
        run: npx playwright install-deps chromium
      - name: Run E2E
        working-directory: e2e
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
        run: npx playwright test --reporter=list,html,json
      - name: Summarize run
        if: always()
        working-directory: e2e
        run: |
          node --input-type=commonjs <<'JS'
            const fs = require("fs");
            if (!fs.existsSync("results.json")) { console.log("results.json 없음(실행 전 실패)"); process.exit(0); }
            const s = JSON.parse(fs.readFileSync("results.json", "utf8")).stats ?? {};
            const row = {
              run: process.env.GITHUB_RUN_ID, pr: process.env.PR, sha: process.env.GITHUB_SHA,
              expected: s.expected ?? 0, unexpected: s.unexpected ?? 0, flaky: s.flaky ?? 0, skipped: s.skipped ?? 0,
              minutes: Math.round((s.duration ?? 0) / 600) / 100,
            };
            fs.writeFileSync("e2e-stats.json", JSON.stringify(row) + "\n");
            const md = `### E2E 결과\n\n| 통과 | 실패 | 재시도 후 통과(flaky) | 건너뜀 | 테스트 시간(분) |\n|---|---|---|---|---|\n| ${row.expected} | ${row.unexpected} | ${row.flaky} | ${row.skipped} | ${row.minutes} |\n`;
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
            console.log(md);
          JS
        env:
          PR: ${{ github.event.pull_request.number }}
      - name: Upload stats
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-stats
          path: e2e/e2e-stats.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
