name: Frontend CI

# develop·master push에서 검사(check)가 성공한 커밋만 GHCR에 이미지를 올린다(publish, PM 총괄 결정 2026-10-09).
# 이미지가 없는 커밋은 배포 승인(loakraken deploy.yml)에서 태그를 찾지 못해 배포할 수 없다.
# 서드파티 액션은 커밋 SHA로 고정한다(주석은 해당 태그).
# Actions 시간 절약(10-10): 초안 PR은 건너뛰고, docs/ 와 저장소 맨 위 마크다운만 바뀐 push는 돌지 않는다.
# content/ 아래 글(개발자 노트 등)은 이미지에 들어가므로 늘 돈다(핫픽스 v0.3.9.2 노트가 이미지 없이 남은 일, 11-09).
# workflow_dispatch: 이미지를 다시 만들어야 할 때 손으로 돌린다(develop·master에서만 올림).
# PR에는 paths-ignore를 두지 않는다. 필수 상태 검사(룰셋)로 지정하면 검사가 아예 안 뜬 PR은 병합할 수 없기 때문이다.
# 같은 PR·브랜치의 이전 실행은 취소한다(concurrency).
on:
  workflow_dispatch:
  pull_request:
    branches: [develop, master]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop, master]
    paths-ignore:
      - docs/**
      - '*.md'

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/loakraken-web

jobs:
  check:
    name: Lint and production build
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 사용자가 한 번 지적한 것이 다시 들어오면 막는다
      # (vault 30 PM/사용자 지적 회귀 점검표 A1 A2 A9 A11 A13 B2 B3).
      - name: Regression checklist guards
        run: npm run check:regressions
        env:
          # blocked names live only in this secret (scripts/blocked-terms.mjs);
          # unset, the names check reports 건너뜀
          BLOCKED_TERMS: ${{ secrets.BLOCKED_TERMS }}
      - run: npm run lint
      - run: npm test
      - name: Generated API types match the checked-in contract
        run: npm run api:generate && git diff --exit-code -- lib/api/schema.d.ts
      - name: Production build and TypeScript validation
        run: npm run build

  # 검사 통과 뒤에만 이미지를 올린다. 저장소 변수 PUBLISH_IMAGES가 'true'일 때만(기본 꺼짐).
  publish:
    name: Publish image
    needs: check
    if: >-
      vars.PUBLISH_IMAGES == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # 이미지 검사 결과(SARIF)를 코드 스캐닝에 올릴 때만 쓴다. 공개 저장소에서도 알림 목록은 쓰기 권한이 있는 사람만 본다.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: web-image
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,mode=max,scope=frontend-image
          provenance: false
      # 올린 web 이미지의 취약점 검사(보고만). 2주 동안 결과를 본 뒤 빌드를 막을지 정한다.
      # 검사·업로드가 실패해도 이미지 발행은 성공으로 남는다(continue-on-error, exit-code 0).
      # 결과는 로그에 표로 찍지 않고 SARIF 파일로만 만들어 코드 스캐닝에 올린다(공개 저장소의 실행 로그는 누구나 본다).
      # trivy-action은 2026-03 태그 변조 사고 뒤에 나온 불변 릴리스 v0.36.0을 커밋 SHA로 고정하고, trivy 본체 버전도 적어 둔다.
      - name: Scan web image (report only)
        id: trivy
        continue-on-error: true
        timeout-minutes: 10
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: ${{ env.IMAGE }}@${{ steps.web-image.outputs.digest }}
          format: sarif
          output: trivy-web.sarif
          exit-code: '0'
          hide-progress: true
      - name: Upload scan to code scanning
        if: always() && hashFiles('trivy-web.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-web.sarif
          category: trivy-image-web
      - name: Scan summary
        if: always()
        env:
          SCAN: ${{ steps.trivy.outcome }}
        run: |
          echo "이미지 검사(보고만): ${SCAN} — 결과는 Security 탭 코드 스캐닝(trivy-image-web)에서 봅니다." >> "$GITHUB_STEP_SUMMARY"
