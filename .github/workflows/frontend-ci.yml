name: Frontend CI

# develop·master push에서 검사(check)가 성공한 커밋만 GHCR에 이미지를 올린다(publish, PM 총괄 결정 2026-10-09).
# 이미지가 없는 커밋은 배포 승인(loakraken deploy.yml)에서 태그를 찾지 못해 배포할 수 없다.
# 서드파티 액션은 커밋 SHA로 고정한다(주석은 해당 태그).
on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/loakraken-web

jobs:
  check:
    name: Lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Generated API types match the checked-in contract
        run: npm run api:generate && git diff --exit-code -- lib/api/schema.d.ts
      - name: Production build and TypeScript validation
        run: npm run build

  # 검사 통과 뒤에만 이미지를 올린다. 저장소 변수 PUBLISH_IMAGES가 'true'일 때만(기본 꺼짐).
  publish:
    name: Publish image
    needs: check
    if: github.event_name == 'push' && vars.PUBLISH_IMAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend-image
          cache-to: type=gha,mode=max,scope=frontend-image
          provenance: false
